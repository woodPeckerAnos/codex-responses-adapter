[project]
name = "codex-responses-adapter"
version = "0.1.0"
description = "Local OpenAI Responses API adapter backed by the Codex CLI through acodex"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Codex Responses Adapter" }]
dependencies = [
    "acodex==0.117.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
codex-responses-adapter = "codex_responses_adapter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_responses_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: exercises a real authenticated Codex CLI (not run by default)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".uv-python", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
